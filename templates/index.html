<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screener</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>AI Resume Screener</h1>
        <p class="subtitle">Upload resumes and let AI rank the best candidates</p>

        <form action="/screen" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Job Description:</label>
                <textarea name="job_description" rows="6" 
                          placeholder="Paste the job description here..."></textarea>
            </div>

            <div class="form-group">
                <label>Upload Resumes (PDF only):</label>
                <input type="file" name="resumes" multiple accept=".pdf">
            </div>

            <button type="submit">Screen Resumes</button>

        </form>

        {% if results %}
        <div class="results">
            <h2>Screening Results</h2>
            {% for result in results %}
            <div class="candidate-card">
                <span class="rank">#{{ loop.index }}</span>
                <span class="name">{{ result.name }}</span>
                <span class="score">{{ result.score }}%</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

    </div>
</body>
</html>
